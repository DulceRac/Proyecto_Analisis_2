openapi: 3.0.3

info:
  title: API Módulo CRM
  version: 1.0.0
  description: >
    API REST para autenticación, gestión de contactos, historial de cambios
    y consulta de relaciones del Módulo CRM. Utiliza persistencia políglota
    mediante PostgreSQL, MongoDB, Redis y Neo4j.

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Servidor local de desarrollo

tags:
  - name: Autenticación
  - name: Contactos
  - name: Historial
  - name: Relaciones

paths:

  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      operationId: login
      x-persistence:
        - PostgreSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              correo: admin@crm.com
              password: Clave1234
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '422':
          $ref: '#/components/responses/ValidationError'

        '500':
          $ref: '#/components/responses/InternalError'

  /contactos:
    get:
      tags:
        - Contactos
      summary: Listar y filtrar contactos
      operationId: listarContactos
      security:
        - bearerAuth: []
      x-persistence:
        - Redis
        - PostgreSQL
      parameters:

        - name: buscar
          in: query
          description: Búsqueda por nombre, apellido, correo o empresa
          required: false
          schema:
            type: string

        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum:
              - general
              - cliente
              - proveedor

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

      responses:
        '200':
          description: Contactos consultados correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags:
        - Contactos
      summary: Registrar un contacto
      operationId: crearContacto
      security:
        - bearerAuth: []
      x-persistence:
        - PostgreSQL
        - MongoDB
        - Redis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoRequest'
            example:
              tipo_contacto: cliente
              nombre: Carlos
              apellido: Lopez
              correo: carlos@example.com
              numero_telefonico: "+50255555555"
              direccion: Ciudad de Guatemala
              empresa: Comercial Lopez
              codigo_cliente: CLI-001

      responses:
        '201':
          description: Contacto creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '422':
          $ref: '#/components/responses/ValidationError'

        '500':
          $ref: '#/components/responses/InternalError'

  /contactos/{id}:
    parameters:
      - $ref: '#/components/parameters/ContactoId'

    get:
      tags:
        - Contactos
      summary: Consultar un contacto
      operationId: obtenerContacto
      security:
        - bearerAuth: []
      x-persistence:
        - Redis
        - PostgreSQL

      responses:
        '200':
          description: Contacto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - Contactos
      summary: Actualizar un contacto
      operationId: actualizarContacto
      security:
        - bearerAuth: []
      x-persistence:
        - PostgreSQL
        - MongoDB
        - Redis

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoRequest'

      responses:
        '200':
          description: Contacto actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '422':
          $ref: '#/components/responses/ValidationError'

        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Contactos
      summary: Desactivar un contacto
      operationId: eliminarContacto
      description: >
        Realiza eliminación lógica mediante el cambio del estado del contacto.
      security:
        - bearerAuth: []
      x-persistence:
        - PostgreSQL
        - MongoDB
        - Redis

      responses:
        '200':
          description: Contacto desactivado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperacionResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalError'

  /contactos/{id}/historial:
    parameters:
      - $ref: '#/components/parameters/ContactoId'

    get:
      tags:
        - Historial
      summary: Consultar historial de un contacto
      operationId: obtenerHistorialContacto
      security:
        - bearerAuth: []
      x-persistence:
        - MongoDB

      responses:
        '200':
          description: Historial obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Historial'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalError'

  /contactos/{id}/relaciones:
    parameters:
      - $ref: '#/components/parameters/ContactoId'

    get:
      tags:
        - Relaciones
      summary: Consultar relaciones de un contacto
      operationId: obtenerRelacionesContacto
      security:
        - bearerAuth: []
      x-persistence:
        - Neo4j

      responses:
        '200':
          description: Relaciones obtenidas correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Relacion'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalError'


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    ContactoId:
      name: id
      in: path
      required: true
      description: Identificador único del contacto
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:

    LoginRequest:
      type: object
      required:
        - correo
        - password
      properties:
        correo:
          type: string
          format: email
          maxLength: 160
        password:
          type: string
          format: password
          minLength: 8

    LoginResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Inicio de sesión correcto.
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiJ9.ejemplo.firma
            token_type:
              type: string
              example: Bearer
            usuario:
              $ref: '#/components/schemas/Usuario'

    Usuario:
      type: object
      properties:
        id_usuario:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Administrador CRM
        correo:
          type: string
          format: email
          example: admin@crm.com
        rol:
          type: string
          enum:
            - estandar
            - administrador
        estado_activo:
          type: boolean
          example: true

    ContactoRequest:
      type: object
      required:
        - tipo_contacto
        - nombre
        - apellido
        - numero_telefonico

      properties:

        tipo_contacto:
          type: string
          enum:
            - general
            - cliente
            - proveedor

        nombre:
          type: string
          minLength: 2
          maxLength: 100

        apellido:
          type: string
          minLength: 2
          maxLength: 100

        correo:
          type: string
          format: email
          nullable: true
          maxLength: 160

        numero_telefonico:
          type: string
          maxLength: 30

        direccion:
          type: string
          nullable: true
          maxLength: 255

        empresa:
          type: string
          nullable: true
          maxLength: 120

        codigo_cliente:
          type: string
          nullable: true
          description: Obligatorio cuando tipo_contacto es cliente.

        codigo_proveedor:
          type: string
          nullable: true
          description: Obligatorio cuando tipo_contacto es proveedor.

    Contacto:
      allOf:
        - $ref: '#/components/schemas/ContactoRequest'
        - type: object
          required:
            - id_contacto
            - id_usuario
            - estado_activo
            - fecha_creacion

          properties:

            id_contacto:
              type: integer
              format: int64
              example: 25

            id_usuario:
              type: integer
              format: int64
              example: 1

            estado_activo:
              type: boolean
              example: true

            fecha_creacion:
              type: string
              format: date-time

            fecha_actualizacion:
              type: string
              format: date-time
              nullable: true

    ContactoResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: Operación realizada correctamente.

        data:
          $ref: '#/components/schemas/Contacto'

    ContactoListResponse:
      type: object
      properties:

        success:
          type: boolean
          example: true

        message:
          type: string
          example: Contactos consultados correctamente.

        data:
          type: array
          items:
            $ref: '#/components/schemas/Contacto'

        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:

        pagina_actual:
          type: integer
          example: 1

        ultima_pagina:
          type: integer
          example: 4

        por_pagina:
          type: integer
          example: 10

        total:
          type: integer
          example: 37

    OperacionResponse:
      type: object
      properties:

        success:
          type: boolean
          example: true

        message:
          type: string
          example: Operación realizada correctamente.

    Historial:
      type: object
      description: Documento almacenado en MongoDB.
      properties:

        id_contacto:
          type: integer
          example: 25

        accion:
          type: string
          enum:
            - creacion
            - actualizacion
            - desactivacion

        usuario:
          type: integer
          example: 1

        cambios:
          type: object
          additionalProperties: true

        fecha:
          type: string
          format: date-time

    Relacion:
      type: object
      description: Relación almacenada como grafo en Neo4j.
      properties:

        id_contacto_origen:
          type: integer
          example: 25

        id_contacto_destino:
          type: integer
          example: 40

        tipo_relacion:
          type: string
          example: PERTENECE_A_EMPRESA

        descripcion:
          type: string
          example: Ambos contactos pertenecen a la misma organización.

    ProblemDetails:
      type: object
      description: >
        Respuesta de error basada en RFC 9457 Problem Details for HTTP APIs.
      required:
        - type
        - title
        - status

      properties:

        type:
          type: string
          format: uri
          example: https://api.crm.local/problems/recurso-no-encontrado

        title:
          type: string
          example: Recurso no encontrado

        status:
          type: integer
          example: 404

        detail:
          type: string
          example: El contacto solicitado no existe.

        instance:
          type: string
          example: /api/v1/contactos/999

        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string

        traceId:
          type: string
          nullable: true
          example: 73c0ca12-7436-4df0-a026-31a63914511c


  responses:

    Unauthorized:
      description: Autenticación requerida o token inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.crm.local/problems/no-autorizado
            title: No autorizado
            status: 401
            detail: El token es inexistente, inválido o ha expirado.
            instance: /api/v1/contactos

    NotFound:
      description: Recurso no encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.crm.local/problems/recurso-no-encontrado
            title: Recurso no encontrado
            status: 404
            detail: El contacto solicitado no existe.
            instance: /api/v1/contactos/999

    ValidationError:
      description: Los datos proporcionados no superaron la validación.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.crm.local/problems/error-validacion
            title: Error de validación
            status: 422
            detail: Uno o más campos contienen valores inválidos.
            instance: /api/v1/contactos
            errors:
              nombre:
                - El nombre es obligatorio.

    InternalError:
      description: Error interno del servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.crm.local/problems/error-interno
            title: Error interno del servidor
            status: 500
            detail: Ocurrió un error inesperado al procesar la solicitud.
            instance: /api/v1/contactos
