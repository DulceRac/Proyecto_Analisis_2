openapi: 3.0.3

info:
  title: API Módulo CRM - Gestión de Contactos
  version: 1.0.0
  description: API para exponer las operaciones principales del Módulo CRM a consumidores externos.

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Servidor local de desarrollo

tags:
  - name: Autenticación
    description: Operaciones de acceso a la API.
  - name: Contactos
    description: Operaciones principales para la gestión de contactos.

paths:
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Valida las credenciales del usuario y genera un token Bearer.
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesión correcto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Solicitud incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas o usuario inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contactos:
    get:
      tags:
        - Contactos
      summary: Listar contactos
      description: Retorna los contactos visibles para el usuario autenticado.
      operationId: listarContactos
      security:
        - bearerAuth: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: Texto para buscar por nombre, apellido, correo, teléfono o empresa.
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          description: Tipo de contacto.
          schema:
            type: string
            enum:
              - general
              - cliente
              - proveedor
              - empleado
        - name: estado
          in: query
          required: false
          description: Estado lógico del contacto.
          schema:
            type: string
            enum:
              - activo
              - inactivo
        - name: page
          in: query
          required: false
          description: Número de página.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: Registros por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Lista de contactos obtenida correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoListResponse'
        '401':
          description: Token ausente o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Contactos
      summary: Crear contacto
      description: Registra un contacto general, cliente, proveedor o empleado.
      operationId: crearContacto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoCreateRequest'
      responses:
        '201':
          description: Contacto creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoResponse'
        '400':
          description: Solicitud incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contactos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador único del contacto.
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      tags:
        - Contactos
      summary: Consultar contacto
      description: Retorna la información general y específica de un contacto.
      operationId: obtenerContacto
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contacto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoResponse'
        '401':
          description: Token ausente o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos para consultar el contacto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contacto no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Contactos
      summary: Actualizar contacto
      description: Modifica los datos generales y la clasificación de un contacto existente.
      operationId: actualizarContacto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoUpdateRequest'
      responses:
        '200':
          description: Contacto actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoResponse'
        '400':
          description: Solicitud incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos para actualizar el contacto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contacto no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Contactos
      summary: Desactivar contacto
      description: Desactiva lógicamente el contacto sin eliminarlo físicamente.
      operationId: desactivarContacto
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contacto desactivado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoEstadoResponse'
        '401':
          description: Token ausente o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos para desactivar el contacto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contacto no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Bearer obtenido mediante POST /auth/login.

  schemas:
    LoginRequest:
      type: object
      required:
        - correo
        - password
      properties:
        correo:
          type: string
          format: email
          maxLength: 160
          example: administrador@crm.com
        password:
          type: string
          format: password
          minLength: 8
          example: Clave1234

    LoginResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Inicio de sesión correcto.
        data:
          type: object
          required:
            - token
            - token_type
            - usuario
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiJ9.ejemplo.firma
            token_type:
              type: string
              example: Bearer
            usuario:
              $ref: '#/components/schemas/UsuarioResumen'

    UsuarioResumen:
      type: object
      required:
        - id_usuario
        - nombre
        - correo
        - rol
        - estado_activo
      properties:
        id_usuario:
          type: integer
          example: 1
        nombre:
          type: string
          example: Administrador CRM
        correo:
          type: string
          format: email
          example: administrador@crm.com
        rol:
          type: string
          enum:
            - estandar
            - administrador
          example: administrador
        estado_activo:
          type: boolean
          example: true

    ContactoCreateRequest:
      type: object
      required:
        - tipo_contacto
        - nombre
        - apellido
        - numero_telefonico
      properties:
        tipo_contacto:
          type: string
          enum:
            - general
            - cliente
            - proveedor
            - empleado
          example: cliente
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          example: Carlos
        apellido:
          type: string
          minLength: 2
          maxLength: 100
          example: López
        correo:
          type: string
          format: email
          nullable: true
          maxLength: 160
          example: carlos@example.com
        numero_telefonico:
          type: string
          minLength: 8
          maxLength: 30
          example: "+502 5555-5555"
        direccion:
          type: string
          nullable: true
          maxLength: 255
          example: Ciudad de Guatemala
        empresa:
          type: string
          nullable: true
          maxLength: 120
          example: Comercial López
        codigo_cliente:
          type: integer
          nullable: true
          minimum: 1
          description: Requerido cuando tipo_contacto es cliente.
          example: 1001
        descripcion:
          type: string
          nullable: true
          maxLength: 255
          description: Requerida cuando tipo_contacto es proveedor.
        puesto:
          type: string
          nullable: true
          maxLength: 100
          description: Requerido cuando tipo_contacto es empleado.
        departamento:
          type: string
          nullable: true
          maxLength: 100
          description: Requerido cuando tipo_contacto es empleado.

    ContactoUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ContactoCreateRequest'

    Contacto:
      type: object
      required:
        - id_contacto
        - id_usuario
        - tipo_contacto
        - nombre
        - apellido
        - numero_telefonico
        - estado_activo
        - fecha_creacion
      properties:
        id_contacto:
          type: integer
          example: 15
        id_usuario:
          type: integer
          example: 1
        tipo_contacto:
          type: string
          enum:
            - general
            - cliente
            - proveedor
            - empleado
        nombre:
          type: string
          example: Carlos
        apellido:
          type: string
          example: López
        correo:
          type: string
          format: email
          nullable: true
        numero_telefonico:
          type: string
          example: "+502 5555-5555"
        direccion:
          type: string
          nullable: true
        empresa:
          type: string
          nullable: true
        estado_activo:
          type: boolean
          example: true
        fecha_creacion:
          type: string
          format: date-time
        fecha_actualizacion:
          type: string
          format: date-time
          nullable: true
        cliente:
          $ref: '#/components/schemas/ClienteDetalle'
        proveedor:
          $ref: '#/components/schemas/ProveedorDetalle'
        empleado:
          $ref: '#/components/schemas/EmpleadoDetalle'

    ClienteDetalle:
      type: object
      nullable: true
      properties:
        codigo_cliente:
          type: integer
          example: 1001

    ProveedorDetalle:
      type: object
      nullable: true
      properties:
        descripcion:
          type: string
          example: Proveedor de equipo de oficina.

    EmpleadoDetalle:
      type: object
      nullable: true
      properties:
        puesto:
          type: string
          example: Analista de sistemas
        departamento:
          type: string
          example: Tecnología

    ContactoResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operación realizada correctamente.
        data:
          $ref: '#/components/schemas/Contacto'

    ContactoListResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Contactos consultados correctamente.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contacto'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      required:
        - pagina_actual
        - ultima_pagina
        - por_pagina
        - total
      properties:
        pagina_actual:
          type: integer
          example: 1
        ultima_pagina:
          type: integer
          example: 4
        por_pagina:
          type: integer
          example: 10
        total:
          type: integer
          example: 36

    ContactoEstadoResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Contacto desactivado correctamente.
        data:
          type: object
          required:
            - id_contacto
            - estado_activo
          properties:
            id_contacto:
              type: integer
              example: 15
            estado_activo:
              type: boolean
              example: false

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: No fue posible procesar la solicitud.
        errors:
          type: object
          nullable: true
          additionalProperties: true
          example: null

    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
        - errors
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Los datos proporcionados no son válidos.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            correo:
              - Ya existe un contacto con ese correo.
            numero_telefonico:
              - El teléfono debe contener entre 8 y 15 dígitos.
